<html lang="zh-CN">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        :root {
            --primary-color: #6a1b9a;
            --secondary-color: #9c27b0;
            --accent-color: #f48fb1;
            --background-color: #0a0a1a;
            --card-color: rgba(255, 255, 255, 0.05);
            --text-color: #ffffff;
            --text-secondary: #b0bec5;
            --border-radius: 12px;
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            line-height: 1.6;
            overflow-x: hidden;
            background-image:
                radial-gradient(circle at 25% 25%, rgba(106, 27, 154, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 75% 75%, rgba(156, 39, 176, 0.1) 0%, transparent 50%);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 40px 0;
            position: relative;
            overflow: hidden;
            border-radius: var(--border-radius);
            background: linear-gradient(135deg, rgba(106, 27, 154, 0.2), rgba(156, 39, 176, 0.2));
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 10px;
            background: linear-gradient(45deg, var(--accent-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            position: relative;
            z-index: 2;
        }

        .subtitle {
            font-size: 1.2rem;
            color: var(--text-secondary);
            position: relative;
            z-index: 2;
        }

        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% {
                opacity: 0.3;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        .horoscope-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .horoscope-card {
            background-color: var(--card-color);
            border-radius: var(--border-radius);
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: var(--transition);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .horoscope-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 12px 40px rgba(156, 39, 176, 0.4);
            border-color: var(--accent-color);
        }

        .horoscope-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color), var(--accent-color));
        }

        .horoscope-card h2 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: var(--accent-color);
        }

        .horoscope-card .date-range {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 15px;
        }

        .horoscope-card .description {
            font-size: 0.95rem;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .horoscope-card .fortune {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .fortune-item {
            text-align: center;
        }

        .fortune-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 5px;
        }

        .fortune-value {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--accent-color);
        }

        .details-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
        }

        .details-modal.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background-color: var(--card-color);
            border-radius: var(--border-radius);
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
            transform: translateY(20px);
            transition: var(--transition);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .details-modal.active .modal-content {
            transform: translateY(0);
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 1.5rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .close-btn:hover {
            color: var(--accent-color);
            transform: rotate(90deg);
        }

        .modal-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .modal-header h2 {
            font-size: 2rem;
            color: var(--accent-color);
            margin-bottom: 10px;
        }

        .modal-header .date-range {
            font-size: 1rem;
            color: var(--text-secondary);
        }

        .modal-body {
            margin-bottom: 30px;
        }

        .modal-section {
            margin-bottom: 25px;
        }

        .modal-section h3 {
            font-size: 1.2rem;
            color: var(--secondary-color);
            margin-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 5px;
        }

        .modal-section p {
            line-height: 1.6;
        }

        .compatibility-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }

        .compatibility-item {
            background-color: rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            transition: var(--transition);
        }

        .compatibility-item:hover {
            background-color: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .compatibility-item .sign {
            font-weight: 600;
            margin-bottom: 5px;
        }

        .compatibility-item .level {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .today-fortune {
            background: linear-gradient(135deg, rgba(106, 27, 154, 0.2), rgba(156, 39, 176, 0.2));
            border-radius: var(--border-radius);
            padding: 30px;
            margin-bottom: 40px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .today-fortune h2 {
            font-size: 2rem;
            margin-bottom: 20px;
            text-align: center;
            color: var(--accent-color);
        }

        .fortune-selector {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }

        .fortune-selector select {
            padding: 10px 20px;
            border-radius: 25px;
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-color);
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .fortune-selector select:hover {
            background-color: rgba(255, 255, 255, 0.15);
            border-color: var(--accent-color);
        }

        .fortune-result {
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: var(--border-radius);
            padding: 20px;
            border-left: 4px solid var(--accent-color);
        }

        .fortune-result h3 {
            font-size: 1.3rem;
            margin-bottom: 15px;
            color: var(--secondary-color);
        }

        .fortune-result p {
            line-height: 1.6;
        }

        footer {
            text-align: center;
            padding: 40px 0;
            color: var(--text-secondary);
            font-size: 0.9rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            margin-top: 40px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }

            .horoscope-grid {
                grid-template-columns: 1fr;
            }

            .modal-content {
                width: 95%;
                padding: 20px;
            }
        }
    </style>
</head>

                fortune: '今天水瓶座的运势较好，工作上会有新的创意和想法，人际关系方面会有不错的交流。财运方面可能会有一些意外的收入，感情方面会有不错的发展。',
                compatibility: [
                    { sign: '双子座', level: '90%' },
                    { sign: '天秤座', level: '85%' },
                    { sign: '射手座', level: '80%' },
                    { sign: '白羊座', level: '75%' }
                ],
                luck: {
                    love: '85%',
                    career: '85%',
                    wealth: '80%'
                }
            },
            {
                id: 'pisces',
                name: '双鱼座',
                dateRange: '2月19日 - 3月20日',
                description: '双鱼座是黄道第十二宫，象征着直觉和灵性。双鱼座的人通常敏感、富有同情心、有创造力，他们有着丰富的想象力和直觉，追求精神上的满足。',
                fortune: '今天双鱼座的运势不错，工作上会有新的机会出现，人际关系方面会更加和谐。财运方面可能会有意外收获，感情方面则需要更多的沟通和理解。',
                compatibility: [
                    { sign: '巨蟹座', level: '90%' },
                    { sign: '天蝎座', level: '85%' },
                    { sign: '金牛座', level: '80%' },
                    { sign: '处女座', level: '75%' }
                ],
                luck: {
                    love: '90%',
                    career: '80%',
                    wealth: '75%'
                }
            }
        ];

        // 生成星星效果
        function generateStars() {
            const starsContainer = document.getElementById('stars');
            const starCount = 100;

            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.width = (Math.random() * 3 + 1) + 'px';
                star.style.height = star.style.width;
                star.style.animationDelay = Math.random() * 3 + 's';
                starsContainer.appendChild(star);
            }
        }

        // 生成星座卡片
        function generateHoroscopeCards() {
            const grid = document.getElementById('horoscope-grid');

            horoscopeData.forEach(horoscope => {
                const card = document.createElement('div');
                card.className = 'horoscope-card';
                card.dataset.id = horoscope.id;

                card.innerHTML = `
                    <h2>${horoscope.name}</h2>
                    <p class="date-range">${horoscope.dateRange}</p>
                    <p class="description">${horoscope.description.substring(0, 100)}...</p>
                    <div class="fortune">
                        <div class="fortune-item">
                            <div class="fortune-label">爱情</div>
                            <div class="fortune-value">${horoscope.luck.love}</div>
                        </div>
                        <div class="fortune-item">
                            <div class="fortune-label">事业</div>
                            <div class="fortune-value">${horoscope.luck.career}</div>
                        </div>
                        <div class="fortune-item">
                            <div class="fortune-label">财运</div>
                            <div class="fortune-value">${horoscope.luck.wealth}</div>
                        </div>
                    </div>
                `;

                card.addEventListener('click', () => openModal(horoscope.id));
                grid.appendChild(card);
            });
        }

        // 打开详情模态框
        function openModal(horoscopeId) {
            const horoscope = horoscopeData.find(h => h.id === horoscopeId);
            const modal = document.getElementById('details-modal');
            const modalTitle = document.getElementById('modal-title');
            const modalDateRange = document.getElementById('modal-date-range');
            const modalDescription = document.getElementById('modal-description');
            const modalFortune = document.getElementById('modal-fortune');
            const modalCompatibility = document.getElementById('modal-compatibility');

            modalTitle.textContent = horoscope.name;
            modalDateRange.textContent = horoscope.dateRange;
            modalDescription.textContent = horoscope.description;
            modalFortune.textContent = horoscope.fortune;

            // 生成配对指数
            modalCompatibility.innerHTML = '';
            horoscope.compatibility.forEach(item => {
                const compatibilityItem = document.createElement('div');
                compatibilityItem.className = 'compatibility-item';
                compatibilityItem.innerHTML = `
                    <div class="sign">${item.sign}</div>
                    <div class="level">${item.level}</div>
                `;
                modalCompatibility.appendChild(compatibilityItem);
            });

            modal.classList.add('active');
        }

        // 关闭模态框
        function closeModal() {
            const modal = document.getElementById('details-modal');
            modal.classList.remove('active');
        }

        // 今日运势选择
        function updateFortune() {
            const select = document.getElementById('horoscope-select');
            const result = document.getElementById('fortune-result');
            const horoscope = horoscopeData.find(h => h.id === select.value);

            result.innerHTML = `
                <h3>${horoscope.name}今日运势</h3>
                <p>${horoscope.fortune}</p>
            `;
        }

        // 事件监听
        document.getElementById('close-btn').addEventListener('click', closeModal);
        document.getElementById('horoscope-select').addEventListener('change', updateFortune);

        // 点击模态框外部关闭
        document.getElementById('details-modal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('details-modal')) {
                closeModal();
            }
        });

        // 初始化
        generateStars();
        generateHoroscopeCards();
    </script>
</body>
</html>
